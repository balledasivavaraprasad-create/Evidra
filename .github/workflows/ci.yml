name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12.14'
  NODE_VERSION: '24.22.1'
  UV_VERSION: '0.11.19'
  NPM_VERSION: '11.14.1'
  LLM_ENABLED: 'false'
  RAG_ENABLED: 'false'
  LANGSMITH_TRACING: 'false'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  validate:
    name: Planning and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      backend_root: ${{ steps.stage.outputs.backend_root }}
      frontend_root: ${{ steps.stage.outputs.frontend_root }}
      integration: ${{ steps.stage.outputs.integration }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate declared stage and prevent PR stage downgrade
        id: stage
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: python scripts/ci/validate_stage.py
      - name: Validate planning links, pins and prompt dependency graph
        run: |
          python scripts/validate_planning.py
          python scripts/validate_prompts.py
          python -m unittest discover -s tests/planning -v
      - name: Install checksum-verified workflow validator
        run: python scripts/ci/install_actionlint.py "$RUNNER_TEMP/actionlint"
      - name: Validate GitHub workflow syntax and expressions
        run: actionlint -shellcheck= -pyflakes= .github/workflows/ci.yml

  backend:
    name: Python and persistence checks
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Frozen Python install
        env:
          BACKEND_ROOT: ${{ needs.validate.outputs.backend_root }}
        run: uv sync --locked --project "$BACKEND_ROOT"
      - name: Check dependencies and all activated application tests
        run: python scripts/ci/run_checks.py backend
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: React and Three.js checks
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ needs.validate.outputs.frontend_root }}/package-lock.json
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
      - name: Frozen frontend install
        working-directory: ${{ needs.validate.outputs.frontend_root }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check dependency probe and all activated frontend tests
        run: python scripts/ci/run_checks.py frontend

  e2e:
    name: Integrated browser acceptance
    needs: [validate, backend, frontend]
    if: needs.validate.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frozen test environments
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --project backend
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright Chromium and OS dependencies
        working-directory: frontend
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Run fixture-backed real API/DB/browser tests
        run: python scripts/ci/run_checks.py e2e
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependency advisory checks
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install locked audit targets
        env:
          BACKEND_ROOT: ${{ needs.validate.outputs.backend_root }}
          FRONTEND_ROOT: ${{ needs.validate.outputs.frontend_root }}
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --project "$BACKEND_ROOT"
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$FRONTEND_ROOT" --ignore-scripts --no-audit --no-fund
          mkdir -p .ci-results
      - name: Audit Python environment
        env:
          BACKEND_ROOT: ${{ needs.validate.outputs.backend_root }}
        run: uv run --locked --project "$BACKEND_ROOT" pip-audit --progress-spinner off --format json --output "$GITHUB_WORKSPACE/.ci-results/python-audit.json"
      - name: Audit frontend (high and critical block merge)
        if: success() || failure()
        working-directory: ${{ needs.validate.outputs.frontend_root }}
        run: npm audit --audit-level=high --json > "$GITHUB_WORKSPACE/.ci-results/npm-audit.json"
      - name: Upload advisory reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: advisory-reports
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: CI Gate
    needs: [validate, backend, frontend, e2e, security]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject failed, cancelled or unexpectedly skipped jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_gate.py
