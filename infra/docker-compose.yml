version: "3.8"

services:
  evidra:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: evidra-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      # Production refuses AUTH_MODE=local; the shared-password gate keeps the demo private.
      - AUTH_MODE=password
      # Set both in infra/.env or your shell (never commit real values):
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a random string of at least 32 characters}
      - SITE_PASSWORD=${SITE_PASSWORD:?Set SITE_PASSWORD to the password people will type to open the site}
      - SEED_DEMO=${SEED_DEMO:-true}
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/review.sqlite
      - CHECKPOINT_DATABASE_URL=sqlite:////app/data/checkpoints.sqlite
      - SOURCE_RATE_LIMIT_PER_SECOND=3.0
      - WORKERS=1
      - RUN_WORKER_IN_PROCESS=true
      - LLM_ENABLED=false
      - RAG_ENABLED=false
    volumes:
      - evidra-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  evidra-data:
    name: evidra-persistent-storage
