# Render Blueprint for Evidra: one Docker web service on the free plan, data in Neon Postgres.
# Create it from the Render dashboard: New > Blueprint > pick this repository.
# You will be asked for DATABASE_URL (Neon pooled connection string), GOOGLE_CLIENT_ID and LLM_API_KEY.
services:
  - type: web
    name: evidra
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    # Free plan: no card needed. The container filesystem is temporary, so all review data lives in
    # Neon Postgres (DATABASE_URL) and survives restarts, redeploys and wake-ups. Only transient
    # LangGraph checkpoints stay on local disk.
    plan: free
    region: singapore
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: accounts
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "false"
      - key: PORT
        value: "8000"
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: WORKERS
        value: "1"
      - key: LLM_ENABLED
        value: "false"
      - key: RAG_ENABLED
        value: "false"
